<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Micro-Check Computers</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 16px; }
    main img { width: 180px; margin: 0 auto 32px; }
    main .btn-row { justify-content: center; }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="/assets/logo.svg" alt="Micro-Check Computers" width="180" height="117">
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <div class="btn-row">
        <a class="btn btn-primary" href="/">Back to the homepage</a>
        <a class="btn btn-ghost" href="{{phoneHref}}">Call {{phone}}</a>
      </div>
    </div>
  </main>
</body>
</html>
